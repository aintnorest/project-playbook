pre-commit:
  commands:
    build-skills:
      run: python3 scripts/build-skills.py && git add skills agents && python3 scripts/build-skills.py --check

pre-push:
  commands:
    python-tests:
      run: python3 scripts/git_environment.py python3 -m unittest discover -s tests
    extension-tests:
      run: python3 scripts/git_environment.py bun test
    omp-load:
      run: python3 scripts/git_environment.py python3 scripts/check-omp-load.py
    markdown:
      run: python3 scripts/git_environment.py mise run lint-markdown
