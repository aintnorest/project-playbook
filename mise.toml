[settings]
lockfile = true

[tools]
python = "3.13"

[tasks.check]
description = "Validate the playbook structure and local links"
run = "python scripts/check.py"

[tasks.sync]
description = "Install this playbook into a target project"
run = "python scripts/sync.py"

[tasks."sync:check"]
description = "Check an installed playbook snapshot"
run = "python scripts/sync.py --check"
